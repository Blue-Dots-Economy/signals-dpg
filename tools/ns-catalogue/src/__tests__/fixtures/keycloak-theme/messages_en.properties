# Login-OTP email copy (aggregator-dpg#626).
#
# Keycloak sends this mail itself over its own SMTP — signals' dispatcher and
# its overridable `messages.properties` (signals-dpg#540) are never consulted
# under AUTH_PROVIDER=keycloak, so this file is the ONLY source of the copy.
# Changing it is a code change plus a theme-image rebuild, not config.
#
# {0} = the OTP code, {1} = the network's sign-off (emailOtpSignoff below,
# rebaked per network by themes.Dockerfile's EMAIL_SIGNOFF build arg).
#
# Note the designed copy addresses the site by name ("...to sign in to
# <siteUrl>"); the URL is deliberately omitted. A login mail must not invite a
# click — following a link lands the user on a fresh page and restarts the OTP
# flow they are already in the middle of.
emailOtpSubject=OTP to verify access
emailOtpSignoff=Team EkStep
emailOtpBody=Hi!\n\nUse the following One-Time Password (OTP) to sign in:\n\n{0}\n\nThis OTP is valid for 5 mins. Do not share it with anyone.\n\n- {1}
emailOtpBodyHtml=<p>Hi!</p><p>Use the following One-Time Password (OTP) to sign in:</p><p><b>{0}</b></p><p>This OTP is valid for 5 mins. Do not share it with anyone.</p><p>- {1}</p>
