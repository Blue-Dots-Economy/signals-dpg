# Purple Dot email copy overrides — PARTIAL override of the bundled email copy.
# Source of truth: "Notifications Events Tracker - ALIMCO" (Email Template
# column). Keys absent here fall back to the instance file
# (EMAIL_MESSAGES_PATH), then the bundled defaults
# (Signals-DPG apps/api/src/notifications/email/messages.default.properties — full key list).
#
# Placeholders are {{likeThis}} and optional; unrecognised ones render as
# literal text. Values are single-line HTML fragments (<p> <b> <a> allowed).
# See Signals-DPG docs/operations/email-copy-overrides.md for the layering rules.
#
# Shell rules (apps/api/src/notifications/email/shells.ts):
#   cta shell   — the shell supplies "Hi!", the CTA button + fallback link and
#                 "Thanks, Team <INSTANCE_NAME>". Bodies here carry NO greeting,
#                 NO link and NO sign-off. Set INSTANCE_NAME=ALIMCO.
#   plain shell — font wrapper only; greeting and sign-off live in the copy.
#
# Role note: the action/lifecycle role suffix is `seeker` | `provider` only —
# the `service_provider` domain folds into `provider`
# (notifications/action_copy.ts resolveRecipientRole). Keys written as
# `...service_provider...` are unknown keys and are dropped with a warning.

# ── Login OTP (plain; signin + signup share this case) ────────────────
# {{signAction}} renders "sign in" / "sign up" (packages/auth/src/config.ts).
login.otp.subject=OTP to verify access
login.otp.body=<p>Hi!</p><p>Use the following One-Time Password (OTP) to {{signAction}} to Purple Dots:</p>{{otpBox}}<p>Please read the Terms of Use and Privacy Policy on the app carefully.</p><p style="font-size: 13px; color: #555;">This OTP is valid for 5 mins. Do not share it with anyone.</p><p>- Team ALIMCO</p>

# ── Welcome — new user created (plain) ───────────────────────────────
# `welcome` is the domain-less fallback; seeker/provider carry role-correct
# copy (provider copy also serves service_provider). See notifications/welcome.ts.
welcome.subject=Welcome to Purple Dots – Complete your profile to get started
welcome.body=<p>Hi!</p><p>You have successfully registered on Purple Dots. You are one step away from finding services near you.</p><p>Complete your profile to get matches that are right for you.</p><p>{{siteLink}}</p><p>- Team ALIMCO</p>
welcome.seeker.subject=Welcome to Purple Dots – Complete your profile to get started
welcome.seeker.body=<p>Hi!</p><p>You have successfully registered on Purple Dots. You are one step away from finding services near you.</p><p>Complete your profile to get matches that are right for you.</p><p>{{siteLink}}</p><p>- Team ALIMCO</p>
welcome.provider.subject=Welcome to Purple Dots – Complete your profile to get started
welcome.provider.body=<p>Hi!</p><p>You have successfully registered on Purple Dots. You are one step away from offering your services near you.</p><p>Complete your profile to start connecting with the right people.</p><p>{{siteLink}}</p><p>- Team ALIMCO</p>

# ── Profile / service lifecycle (cta) ────────────────────────────────
# Seeker → profile.*, provider → offer.* (notify_item_lifecycle.ts). The tracker
# rows are written seeker-first; the offer.* mirrors carry the same copy in
# provider language so a provider never falls through to the bundled default.
profile.create.subject=Your profile is ready – Start exploring opportunities
profile.create.body=<p>Your profile is ready. You can now browse opportunities and services that match your needs.</p>
profile.create.cta=View your profile

profile.update.subject=Your profile has been updated successfully
profile.update.body=<p>Your profile has been updated successfully. Click below to view your updated profile.</p>
profile.update.cta=View your profile

profile.pause.subject=Your profile has been paused successfully
profile.pause.body=<p>Your profile has been paused successfully. Click below to view your paused profile.</p>
profile.pause.cta=View your profile
offer.pause.subject=Your service has been paused successfully
offer.pause.body=<p>Your service has been paused successfully. Click below to view your paused service.</p>
offer.pause.cta=View your service

# cta shell: greeting, CTA button and sign-off come from the shell, so these
# bodies carry none of them. The tracker's copy has no call to action, but the
# cta shell always renders a button — these labels are the least-wrong ones.
profile.retire.subject=Your profile has been deleted successfully
profile.retire.body=<p>Your profile on Purple Dots has been deleted successfully.</p>
profile.retire.cta=Create a new profile
offer.retire.subject=Your service has been deleted successfully
offer.retire.body=<p>Your service on Purple Dots has been deleted successfully.</p>
offer.retire.cta=Create a new service

# ── Aggregator onboarding — account ready (cta) ──────────────────────
account.aggregator_init.seeker.subject=Your account is ready — activate it to get started
account.aggregator_init.seeker.body=<p>Your details have been added to Purple Dots by {{aggregatorOrg}}.</p><p>Please visit the app to activate your account and start discovering opportunities and services near you.</p>
account.aggregator_init.seeker.cta=Activate your account
account.aggregator_init.provider.subject=Your account is ready — activate it to get started
account.aggregator_init.provider.body=<p>Your details have been added to Purple Dots by {{aggregatorOrg}}.</p><p>Please visit the app to activate your account and start offering your services to seekers near you.</p>
account.aggregator_init.provider.cta=Activate your account

# ── Connect — recipient = seeker (cta) ───────────────────────────────
action.connect.seeker.inbound_request.subject=A service provider wants to connect with you
action.connect.seeker.inbound_request.body=<p>{{name}} is interested in connecting with you. They may have a service that is right for you.</p><p>Click below to view the details and respond.</p>
action.connect.seeker.inbound_request.cta=View the details and respond
action.connect.seeker.outbound_request.subject=Your connection request has been sent to {{name}}
action.connect.seeker.outbound_request.body=<p>Your connection request has been sent to {{name}}. They have been notified. You can track the status here.</p>
action.connect.seeker.outbound_request.cta=Track your request
action.connect.seeker.inbound_status.subject={{name}} has responded to your connection request
action.connect.seeker.inbound_status.body=<p>{{name}} has responded to your connection request. Check the update and take the next step.</p>
action.connect.seeker.inbound_status.cta=View their response
action.connect.seeker.outbound_status.subject=Your response has been sent to {{name}}
action.connect.seeker.outbound_status.body=<p>Your response to {{name}} has been sent. They have been notified. You can track the status here.</p>
action.connect.seeker.outbound_status.cta=View the details

# ── Connect — recipient = provider / service_provider (cta) ──────────
action.connect.provider.inbound_request.subject=A seeker is interested in your service
action.connect.provider.inbound_request.body=<p>A seeker is interested in the service you are offering and wants to connect with you.</p><p>Click below to view their details and respond.</p>
action.connect.provider.inbound_request.cta=View their details and respond
action.connect.provider.outbound_request.subject=Your connection request has been sent to the seeker
action.connect.provider.outbound_request.body=<p>Your connection request has been sent to the seeker. They have been notified. You can track the status here.</p>
action.connect.provider.outbound_request.cta=Track your request
action.connect.provider.inbound_status.subject=The seeker has responded to your connection request
action.connect.provider.inbound_status.body=<p>The seeker has responded to your connection request. Check the update and take the next step.</p>
action.connect.provider.inbound_status.cta=View their response
action.connect.provider.outbound_status.subject=Your response has been sent to the seeker
action.connect.provider.outbound_status.body=<p>Your response has been sent to the seeker. They have been notified. You can track the status here.</p>
action.connect.provider.outbound_status.cta=View the details

# ── Guardian OTP (U18) (plain) ───────────────────────────────────────
# The tracker places the sign-off after the validity line for these.
# guardian.account has no subject row in the tracker — bundled default applies.
guardian.account.body=<p>Hi {{parentName}},</p><p>Your ward has requested registration on Purple Dots. This website shows services and opportunities relevant to your ward. Use the given OTP to agree to create their account.</p>{{otpBox}}<p style="font-size: 13px; color: #555;">This OTP is valid for 10 minutes. Do not share it with anyone.</p><p>- Team ALIMCO</p>
guardian.profile.subject=OTP to verify access of your ward
guardian.profile.body=<p>Hi {{parentName}},</p><p>Your ward has requested to create a profile on Purple Dots. This profile will help your ward in discovering, and matching to relevant services and opportunities. Use the given OTP to agree to create their profile.</p>{{otpBox}}<p style="font-size: 13px; color: #555;">This OTP is valid for 10 minutes. Do not share it with anyone.</p><p>- Team ALIMCO</p>
# One case serves both "action initiate - connect" and "action accept - connect".
# The tracker's "They offer <what they offer>" sentence is omitted: no token
# carries the provider's offering, and an undeclared {{token}} renders as
# literal text in the delivered email.
guardian.action.subject=OTP to share information of your ward
guardian.action.body=<p>Hi {{parentName}},</p><p>Your ward has requested to connect to <b>{{org}}</b>. This will share your ward's profile details, along with name, phone, and email with the organisation. Use the given OTP to allow <b>{{org}}</b> to access your ward's details.</p>{{otpBox}}<p style="font-size: 13px; color: #555;">This OTP is valid for 10 minutes. Do not share it with anyone.</p><p>- Team ALIMCO</p>
