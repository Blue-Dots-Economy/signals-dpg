# Email copy override for network: yellow_dot (#529)
#
# This file is a PARTIAL override of the bundled email copy — uncomment and
# edit only the lines you want to change. Anything absent here falls back to
# the instance file (EMAIL_MESSAGES_PATH), then the bundled defaults.
#
# Placeholders are written {{likeThis}}. They are optional — use only the
# ones you need. Anything not recognised is left in the email as-is, exactly
# as typed.
#
# See Signals-DPG docs/operations/email-copy-overrides.md for the full layering and
# deploy mechanics, and
# Signals-DPG apps/api/src/notifications/email/messages.default.properties for the
# complete list of keys and their placeholders.

# key=value examples — copy a real key from messages.default.properties,
# uncomment, and edit:
# welcome.subject=Welcome to Yellow Dot!
# welcome.body=<p>Congratulations {{userName}}! You just went live with an account on Yellow Dot.</p>
# login.otp.subject=Your One-Time Password (OTP) for Yellow Dot
