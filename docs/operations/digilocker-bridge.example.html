<!DOCTYPE html>
<!--
  EXAMPLE ONLY — NOT SHIPPED, NOT WIRED UP, NOT SAFE TO HOST AS-IS.

  This page used to live in apps/ui/public/, which Vite copies verbatim to the
  served root — so every UI deployment served it at /digilocker-bridge.html even
  though nothing in the app ever navigated to it. DigiLocker integration is not
  active, so it was reachable dead weight. Moved here (Blue-Dots-Economy/signals-dpg#600)
  so it stops being bundled and served; nothing executes it from this directory.

  BEFORE ANY DEPLOYMENT HOSTS THIS FILE, fix the postMessage calls below.

  All four pass '*' as the target origin while carrying the DigiLocker
  authorization code — once in `code`, and again in `finalUrl`, which is
  window.location.href and contains the code as a query parameter. '*' means the
  browser delivers to whatever window opened this page, including an attacker's.
  Replace '*' with the exact origin of the application that opened the popup
  (window.location.origin if the bridge is served from that same origin), so the
  browser drops the message when the opener is not that origin.

  The receiving end (apps/ui/src/components/wallet/providers/digilocker-provider.tsx)
  already validates event.origin against an allowlist, which protects the app
  from a hostile *sender*. It cannot protect this page's *recipient* — that
  direction is this file's responsibility, and it is the higher-severity one.

  Docs: docs/operations/digilocker-integration.md
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigiLocker Authentication Bridge</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      max-width: 520px;
    }
    .code {
      background: rgba(255, 255, 255, 0.2);
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      word-break: break-all;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✅ DigiLocker Authentication Successful</h1>
    <p id="status">Processing authorization code...</p>
    <div id="code" class="code" hidden></div>
  </div>
  <script>
    function extractCode() {
      const params = new URLSearchParams(window.location.search);
      return params.get('code');
    }

    function post(code) {
      const redirectMessage = {
        type: 'DIGILOCKER_REDIRECT',
        code,
        timestamp: Date.now(),
      };
      const doneMessage = {
        type: 'DIGILOCKER_DONE',
        finalUrl: window.location.href,
        timestamp: Date.now(),
      };

      if (window.opener) {
        window.opener.postMessage(redirectMessage, '*');
        window.opener.postMessage(doneMessage, '*');
      }
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(redirectMessage, '*');
        window.parent.postMessage(doneMessage, '*');
      }
    }

    const code = extractCode();
    if (code) {
      document.getElementById('status').textContent = 'Authorization code detected and sent to the application.';
      const codeElement = document.getElementById('code');
      codeElement.hidden = false;
      codeElement.textContent = code;
      post(code);
      const interval = setInterval(() => post(code), 2000);
      setTimeout(() => clearInterval(interval), 30000);
      setTimeout(() => {
        if (window.opener) {
          window.close();
        }
      }, 3000);
    } else {
      document.getElementById('status').textContent = 'No authorization code found in URL.';
    }
  </script>
</body>
</html>
