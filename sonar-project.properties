sonar.organization=blue-dots-economy
sonar.projectKey=Blue-Dots-Economy_signals-dpg
sonar.projectName=signals-dpg

# database/notification/match_score are deliberately out of the analysed
# scope: they are thin service-client/table-definition packages with no test
# suites, and are not part of the coverage target.
#
# apps/ui/public IS in scope (#600). Vite copies it verbatim to the served root,
# so anything there is live, publicly-reachable code — but it sat outside
# sonar.sources, which is how a page posting DigiLocker authorization codes to
# `targetOrigin: '*'` went unanalysed while #590 was fixing the receive side of
# the same weakness one directory over. Static assets are not a lower tier of
# code just because no bundler touches them.
sonar.sources=apps/api/src,apps/api/plugins,apps/ui/public,apps/ui/src,packages/auth,packages/config/src,packages/schemas/src
sonar.tests=apps/api/src,apps/api/plugins,apps/ui/src,packages/auth,packages/config/src,packages/schemas/src
sonar.test.inclusions=**/__tests__/**/*.test.ts,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/node_modules/**,**/dist/**,**/coverage/**
# Coverage exclusions, and why each is here (kept in sync with the
# coverage.exclude list in apps/api/vitest.config.ts so the local lcov number
# and the SonarCloud number agree):
#   - apps/ui/src/components/ui/**  generated shadcn component kit, not app logic
#   - apps/api/src/server.ts        bootstrap entry (dotenv order, listen, shutdown)
#   - apps/api/src/scripts/**       one-off operational CLI commands; their real
#                                   logic lives in the pure modules they call
#   - apps/ui/src/main.tsx,
#     apps/ui/src/tourist/main.tourist.tsx
#                                   the two Vite entry points (default + tourist)
#   - apps/ui/src/test/**           the ui vitest harness (setup.ts + shared
#                                   helpers), matching the 'src/test/**' entry in
#                                   apps/ui/vitest.config.ts. apps/api's harness
#                                   sits at the package root and is already
#                                   caught by **/vitest.setup.ts above; the ui
#                                   one lives under src/, so without this Sonar
#                                   treats test scaffolding as production source
#                                   and asks for coverage the lcov deliberately
#                                   omits.
sonar.coverage.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/vitest.config.ts,**/vitest.setup.ts,apps/ui/src/components/ui/**,apps/api/src/server.ts,apps/api/src/scripts/**,apps/ui/src/main.tsx,apps/ui/src/tourist/main.tourist.tsx,apps/ui/src/test/**

# apps/api reports TWO lcov files: the default unit run, plus the integration
# run (vitest.integration.config.ts) which needs live Postgres + Redis and is
# excluded from the default suite. SonarCloud merges per-file hit counts across
# reportPaths, so a line covered by either run counts. Without the integration
# report, ~25 existing-and-passing integration suites contribute nothing.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/api/coverage-integration/lcov.info,apps/ui/coverage/lcov.info,packages/auth/coverage/lcov.info,packages/config/coverage/lcov.info,packages/schemas/coverage/lcov.info

sonar.sourceEncoding=UTF-8

# Rule exclusion — one rule, one file, with the reason.
#
# typescript:S7767 ("Use Math.trunc instead of | 0") fires on
# apps/api/src/services/geocoding/jitter.ts, where `| 0` and `>>> 0` are
# mulberry32's 32-bit wraparound, not a truncation shortcut. Math.trunc drops
# the fraction WITHOUT wrapping, so taking the rule's advice changes the PRNG's
# output stream — and that stream is what places every jittered PII coordinate.
# A different stream means every already-stored home location maps to a
# different pin, i.e. profiles visibly move on the map for no reason. The rule
# is right about the idiom in general and wrong here, so it is disabled for this
# one file rather than repo-wide.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S7767
sonar.issue.ignore.multicriteria.e1.resourceKey=apps/api/src/services/geocoding/jitter.ts
#
# typescript:S4790 ("weak hash algorithm") fires on
# apps/api/src/utils/cryptojs_aes.ts, where MD5 is OpenSSL's EVP_BytesToKey —
# the key-derivation step of the CryptoJS passphrase format the NCS partner
# portal encrypts its SSO `sig` parameter with. It is fixed by that external
# format: any other hash derives a different key and every NCS link fails to
# decrypt. Nothing here relies on MD5's collision resistance — the value is a
# tamper check behind NCS validate-token, which is the authoritative check.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S4790
sonar.issue.ignore.multicriteria.e2.resourceKey=apps/api/src/utils/cryptojs_aes.ts
