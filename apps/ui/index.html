<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Initial title — replaced by theme-provider once the active network's
         brand is known (becomes e.g. "Purple Dot · Signal Stack"). -->
    <title>Signal Stack</title>

    <!-- Runtime config (window.__DPG_UI_CONFIG__) — written by the chart at
         deploy time (helmcharts/dpg/charts/ui/templates/configmap.yaml) and
         mounted at /config.js by nginx. Must load BEFORE /src/main.tsx so
         api-config.ts picks up VITE_API_URL/VITE_NETWORK_NAME at module
         init; otherwise it falls through to compile-time defaults. -->
    <script src="/config.js"></script>

    <!-- Set data-network before React boots so first CSS paint has the
         right brand tokens. Favicon is generated as a square SVG using
         the active network's --brand-cta colour after the brand-themes
         style block (injected by the Vite plugin) is parsed. -->

    <script>
      (function () {
        var url = new URLSearchParams(location.search).get('network');
        // Runtime config from /config.js (loaded above). Lets the chart's
        // runtimeConfig.VITE_NETWORK_NAME pick the brand for first paint,
        // so a single image works across networks (purple_dot, blue_dot, …).
        var rt =
          (window.__DPG_UI_CONFIG__ && window.__DPG_UI_CONFIG__.VITE_NETWORK_NAME) || null;
        var storedNet = null;
        try { storedNet = localStorage.getItem('dpg-active-network'); } catch (_) {}
        var fallback =
          typeof __DEFAULT_NETWORK_THEME__ !== 'undefined'
            ? __DEFAULT_NETWORK_THEME__
            : 'blue_dot';
        var id = url || rt || storedNet || fallback;
        document.documentElement.dataset.network = id;

        // Resolve brand (query ?brand= → runtime config → build default → 'standard').
        // Parallel to network resolution above; CSS override blocks match real brand slugs.
        var params = new URLSearchParams(window.location.search);
        var cfg = window.__DPG_UI_CONFIG__ || {};
        var brand = (params.get('brand') || cfg.VITE_BRAND_NAME || (typeof __DEFAULT_BRAND__ !== 'undefined' ? __DEFAULT_BRAND__ : '') || 'standard').trim();
        document.documentElement.dataset.brand = brand || 'standard';

        // Apply dark class before first paint so the user doesn't see a
        // light flash when their stored preference is dark. Default mode
        // is light — only honour system pref if user explicitly chose it.
        try {
          var stored = localStorage.getItem('dpg-theme-mode');
          var resolved =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (resolved) document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>

    <!-- Config-driven Google Analytics loader. No-op unless this deployment's
         /config.js sets VITE_ANALYTICS_GA_ID. Must come after /config.js. -->
    <script src="/analytics.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
