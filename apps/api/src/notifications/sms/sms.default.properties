# ── SMS templates (#532/#535) ─────────────────────────────────────────────────
# Per-event SMS routing. `template_id` is the DLT-approved provider flow id —
# BLANK here (not yet approved); a blank id makes the send a no-op. Override
# per network/brand (sms.properties in the network/brand folder). `body` is a
# REFERENCE of the approved text (NOT sent — rendered provider-side); keep it
# byte-identical to the DLT-approved template. `vars` lists the template's
# named variables. Sign-off (EkStep/ALIMCO) is part of the approved text per
# deployment.
profile.create.template_id=
profile.create.body=Your profile is ready, {{name}}! Discover jobs and services near you: {{link}}
profile.create.vars=name,link
offer.create.template_id=
offer.create.body=Your offer is now live, {{name}}. Seekers can discover it: {{link}}
offer.create.vars=name,link
profile.update.template_id=
profile.update.body=Your profile has been updated, {{name}}: {{link}}
profile.update.vars=name,link
offer.update.template_id=
offer.update.body=Your offer has been updated, {{name}}: {{link}}
offer.update.vars=name,link
account.aggregator_init.template_id=
account.aggregator_init.body=Hi {{name}}, {{aggregatorOrg}} has added you. Activate your account: {{link}}
account.aggregator_init.vars=name,aggregatorOrg,link
