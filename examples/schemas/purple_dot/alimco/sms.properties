# ── ALIMCO (Purple Dots) event SMS (notification-service#191) ────────────────
# Each `template_id` is a template_key that notification-service declares in
# its PINNACLE_TEMPLATES_FILE (DLT id + approved text live there). `body` is
# the DLT-approved text for reference only; it is never sent. Source:
# PurpleDots_Templates_approved_Final.xlsx. A case missing here sends no SMS,
# so provider profiles (offer.*) get none for now.

profile.create.template_id=profile_created_sms
profile.create.body=Your profile on Purple Dots has been created successfully. View it: {{url}} - Team ALIMCO
profile.create.vars=url
profile.create_incomplete.template_id=profile_created_sms
profile.create_incomplete.body=Your profile on Purple Dots has been created successfully. View it: {{url}} - Team ALIMCO
profile.create_incomplete.vars=url
profile.update.template_id=profile_updated_sms
profile.update.body=Your profile on Purple Dots has been updated successfully. View it: {{url}} - Team ALIMCO
profile.update.vars=url
profile.pause.template_id=profile_paused_sms
profile.pause.body=Your profile on Purple Dots has been paused successfully. View it: {{url}} - Team ALIMCO
profile.pause.vars=url
profile.retire.template_id=profile_retired_sms
profile.retire.body=Your profile on Purple Dots has been deleted successfully. - Team ALIMCO
profile.retire.vars=

account.aggregator_init.seeker.template_id=bulk_upload_seeker_ready_sms
account.aggregator_init.seeker.body=Your seeker account on Purple Dots has been created successfully. Activate it here: {{url}} - Team ALIMCO
account.aggregator_init.seeker.vars=url
account.aggregator_init.provider.template_id=bulk_upload_provider_ready_sms
account.aggregator_init.provider.body=Your service provider account on Purple Dots has been created successfully. Activate it here: {{url}} - Team ALIMCO
account.aggregator_init.provider.vars=url

welcome.template_id=welcome_post_registration_sms
welcome.body=Welcome to Purple Dots! Your account has been created successfully. Complete your profile here: {{url}} - Team ALIMCO
welcome.vars=url
welcome.seeker.template_id=welcome_post_registration_sms
welcome.seeker.body=Welcome to Purple Dots! Your account has been created successfully. Complete your profile here: {{url}} - Team ALIMCO
welcome.seeker.vars=url
welcome.provider.template_id=welcome_post_registration_sms
welcome.provider.body=Welcome to Purple Dots! Your account has been created successfully. Complete your profile here: {{url}} - Team ALIMCO
welcome.provider.vars=url

support.request.template_id=support_complaint_confirmation_sms
support.request.body=Purple Dots: We have received your {{type}} (Ref: {{reference}}). Our team will get back to you soon. - Team ALIMCO
support.request.vars=type,reference

# Connections: `name` is the provider's service name (seeker copy only).
action.connect.seeker.inbound_request.template_id=connect_notify_receiver_seeker_sms
action.connect.seeker.inbound_request.body={{name}} is interested in connecting with you on Purple Dots. View details and respond: {{url}} - Team ALIMCO
action.connect.seeker.inbound_request.vars=name,url
action.connect.seeker.outbound_request.template_id=connect_notify_sender_seeker_sms
action.connect.seeker.outbound_request.body=Your connection request has been sent to {{name}} on Purple Dots. They have been notified. Track status: {{url}} - Team ALIMCO
action.connect.seeker.outbound_request.vars=name,url
action.connect.seeker.inbound_status.template_id=connect_status_notify_receiver_seeker_sms
action.connect.seeker.inbound_status.body={{name}} has responded to your request on Purple Dots. Check the update: {{url}} - Team ALIMCO
action.connect.seeker.inbound_status.vars=name,url
action.connect.seeker.outbound_status.template_id=connect_status_notify_sender_seeker_sms
action.connect.seeker.outbound_status.body=Your response has been sent to {{name}} on Purple Dots. Track status: {{url}} - Team ALIMCO
action.connect.seeker.outbound_status.vars=name,url
action.connect.provider.inbound_request.template_id=connect_notify_receiver_provider_sms
action.connect.provider.inbound_request.body=A seeker is interested in your service on Purple Dots. View details and respond: {{url}} - Team ALIMCO
action.connect.provider.inbound_request.vars=url
action.connect.provider.outbound_request.template_id=connect_notify_sender_provider_sms
action.connect.provider.outbound_request.body=Your request has been sent to the seeker on Purple Dots. They have been notified. Track status: {{url}} - Team ALIMCO
action.connect.provider.outbound_request.vars=url
action.connect.provider.inbound_status.template_id=connect_status_notify_receiver_provider_sms
action.connect.provider.inbound_status.body=The seeker has responded to your request on Purple Dots. Check the update: {{url}} - Team ALIMCO
action.connect.provider.inbound_status.vars=url
action.connect.provider.outbound_status.template_id=connect_status_notify_sender_provider_sms
action.connect.provider.outbound_status.body=Your response has been sent to the seeker on Purple Dots. Track status: {{url}} - Team ALIMCO
action.connect.provider.outbound_status.vars=url

# Guardian OTP. A bulk approval has no template and uses the generic OTP.
guardian.account.template_id=guardian_otp_signup_sms
guardian.account.body=Enter the OTP {{otp}} to approve your ward's registration on Purple Dots. Valid for 10 mins. Do not share with anyone. - Team ALIMCO
guardian.account.vars=otp
guardian.profile.template_id=guardian_otp_profile_sms
guardian.profile.body=Enter the OTP {{otp}} to approve your ward's profile creation on Purple Dots. Valid for 10 mins. Do not share with anyone. - Team ALIMCO
guardian.profile.vars=otp
guardian.action.initiate.template_id=guardian_otp_connect_initiate_sms
guardian.action.initiate.body=Enter the OTP {{otp}} to allow {{org}} to access your ward's details on Purple Dots, as your ward sent them a request. Valid for 10 mins. Do not share. - Team ALIMCO
guardian.action.initiate.vars=otp,org
guardian.action.accept.template_id=guardian_otp_connect_accept_sms
guardian.action.accept.body=Enter the OTP {{otp}} to allow {{org}} to access your ward's details on Purple Dots, as your ward accepted their request. Valid for 10 mins. Do not share. - Team ALIMCO
guardian.action.accept.vars=otp,org
