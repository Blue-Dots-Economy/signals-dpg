# Email copy override for network: orange_dot, brand: onetac (#529)
#
# This file is a PARTIAL override of the bundled email copy — uncomment and
# edit only the lines you want to change. Anything absent here falls back to
# the network file, then the instance file, then the bundled defaults.
#
# Placeholders are written {{likeThis}}. They are optional — use only the
# ones you need. Anything not recognised is left in the email as-is, exactly
# as typed.
#
# See docs/operations/email-copy-overrides.md for the full layering and
# deploy mechanics, and
# apps/api/src/notifications/email/messages.default.properties for the
# complete list of keys and their placeholders.

# key=value examples — copy a real key from messages.default.properties,
# uncomment, and edit:
# welcome.subject=Welcome to OneTAC!
# welcome.body=<p>Congratulations {{userName}}! You just went live with an account on OneTAC.</p>
# login.otp.subject=Your One-Time Password (OTP) for OneTAC
