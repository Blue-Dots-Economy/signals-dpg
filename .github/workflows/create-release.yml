# Create release
#
# Thin caller. All release logic (tag validation, CI gate, release creation,
# build dispatch, release-notes fragment) lives once in bluedots-automation's
# .github/workflows/create-release.yml so the four service repos can't drift
# apart. This workflow replaced this repo's `cut-release.yaml`.
#
# Sprint tags pick their own branch: candidate (YYYYMM-sN-rcN) from develop,
# release (YYYYMM-sN) from main, hotfix (YYYYMM-sN.M) from release/YYYYMM-sN, which
# the release tag creates. `base` only matters for v*.*.* and extra tags.
# Run with dry_run first to preview the notes.
#
# The pin below is bluedots-automation's `feature` commit for #297. Repin to
# @main once it is promoted. The same SHA is passed as automation-ref so the scripts match.

name: Create release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag: candidate 202611-s1-rc1, release 202611-s1, hotfix 202611-s1.1, or v1.2.0"
        required: true
        type: string
      base:
        description: "Only for v*.*.* / extra tags; sprint tags pick their own branch (rc → develop, release → main, hotfix → release/<sprint>)"
        type: string
        default: ''
      dry_run:
        description: "Check everything and preview the notes, but create nothing"
        type: boolean
        default: false
      skip_ci_check:
        description: "Tag even if CI has not passed (emergency use only)"
        type: boolean
        default: false
      docs_only:
        description: "The tag and release already exist: only re-publish the docs fragment"
        type: boolean
        default: false

permissions: {}

jobs:
  release:
    permissions: { contents: write, actions: write }
    uses: Blue-Dots-Economy/bluedots-automation/.github/workflows/create-release.yml@3c4286ff7897b30c1507e82209929a3fb4f4088e # feature 2026-10-29 (bluedots-automation#297) -- repin to @main once promoted
    with:
      tag: ${{ inputs.tag }}
      base: ${{ inputs.base }}
      dry_run: ${{ inputs.dry_run }}
      skip_ci_check: ${{ inputs.skip_ci_check }}
      docs_only: ${{ inputs.docs_only }}
      ci-workflow: ci.yaml
      build-workflow: build-images.yaml
      automation-ref: 3c4286ff7897b30c1507e82209929a3fb4f4088e
    secrets:
      docs-token: ${{ secrets.DOCS_SYNC_TOKEN }}
