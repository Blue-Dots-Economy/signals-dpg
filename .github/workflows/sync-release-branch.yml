# Sync release branch
#
# Thin caller. When a hotfix lands on release/<YYYYMM-sN> (the branch the release
# tag creates, see create-release.yml), this opens PRs release/<sprint> -> develop
# and -> feature for whichever is missing commits, so the fix is carried back.
# All logic lives once in bluedots-automation's
# .github/workflows/sync-release-branch.yml.
#
# Merge these PRs with a merge commit, NOT squash, so the fix keeps its history
# and the next promotion does not conflict.
#
# Requires the repo setting "Allow GitHub Actions to create and approve pull
# requests" (Settings -> Actions -> General) to be on. PRs opened by GITHUB_TOKEN
# do not trigger CI on their own: close and reopen the PR to run it.

name: Sync release branch

on:
  push:
    branches: ['release/**']

permissions: {}

jobs:
  sync:
    permissions: { contents: read, pull-requests: write }
    uses: Blue-Dots-Economy/bluedots-automation/.github/workflows/sync-release-branch.yml@3c4286ff7897b30c1507e82209929a3fb4f4088e # feature 2026-10-29 (bluedots-automation#297) -- repin to @main once promoted
    with:
      automation-ref: 3c4286ff7897b30c1507e82209929a3fb4f4088e
