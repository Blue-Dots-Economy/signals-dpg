name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec tsc --noEmit

  typecheck-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ui exec tsc --noEmit

  test:
    runs-on: ubuntu-latest
    # Runs `pnpm -r test` across all workspaces. Packages without their
    # own test suites use a no-op `echo "no tests yet"` script so the
    # workspace-recursive run stays green.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test

  dep-cruise:
    runs-on: ubuntu-latest
    continue-on-error: true
    # `hashFiles()` is not available in job-level `if` expressions — GitHub
    # evaluates those before the runner provisions a workspace, so there is
    # no filesystem yet. Guard at step level instead, after checkout.
    steps:
      - uses: actions/checkout@v4
      - name: Note when dep-cruise config is absent
        if: hashFiles('.dependency-cruiser.cjs') == ''
        run: echo "::notice::No .dependency-cruiser.cjs found; skipping dep-cruise."
      - uses: pnpm/action-setup@v4
        if: hashFiles('.dependency-cruiser.cjs') != ''
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        if: hashFiles('.dependency-cruiser.cjs') != ''
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: hashFiles('.dependency-cruiser.cjs') != ''
      - run: pnpm dep-check
        if: hashFiles('.dependency-cruiser.cjs') != ''

  schema-parity:
    runs-on: ubuntu-latest
    # Schema-parity verifies that drizzle-kit push and the bundled
    # schema.sql produce identical PG schemas for the Drizzle-managed
    # surface (auth + metrics tables).
    #
    # The partitioned tables (items, item_actions, action_events) live
    # in packages/database/src/drizzle_ref_tables/ for type inference
    # only — they're not in apps/api/drizzle.config.ts and can't be
    # drizzle-pushed because pgTable doesn't model PARTITION BY. The
    # SQL bundle owns them. The Diff schemas step below excludes them
    # (--exclude-table) plus the extensions they depend on
    # (cube/earthdistance/pgcrypto) via a sed strip.
    services:
      pg-sql:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      pg-drizzle:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PG_SQL_URL: postgres://postgres:postgres@localhost:5432/postgres
      PG_DRIZZLE_URL: postgres://postgres:postgres@localhost:5433/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Regenerate schema bundle (must be a no-op if already fresh)
        run: pnpm schema:bundle:check

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply bundled schema.sql to pg-sql
        run: |
          # item_search and its pgvector/postgis extensions are owned by the SQL
          # bundle but are NOT part of the drizzle-managed parity surface (like the
          # partitioned tables) and need third-party extensions absent from stock
          # postgres. Strip them before applying; they're excluded from the diff too.
          grep -vE '^CREATE EXTENSION IF NOT EXISTS (vector|postgis);' apps/api/db/postgres/schema.sql \
            | awk '/item_search \(Signals search engine/{skip=1} skip&&/WHERE lifecycle_status/{skip=0;next} skip{next} {print}' \
            > /tmp/schema_parity.sql
          psql "$PG_SQL_URL" -v ON_ERROR_STOP=1 -f /tmp/schema_parity.sql

      - name: Apply Drizzle migrations to pg-drizzle
        env:
          POSTGRES_URL: ${{ env.PG_DRIZZLE_URL }}
        run: pnpm --filter api exec drizzle-kit push --force

      - name: Diff schemas
        run: |
          # Dump pg-sql excluding partitioned tables (items, item_actions,
          # action_events). drizzle-kit doesn't manage these because
          # pgTable can't model PARTITION BY — they live in the SQL
          # bundle only. Their indexes/FKs/check-constraints dump
          # alongside the parent tables and disappear with them.
          pg_dump --schema-only --no-owner --no-privileges \
            --exclude-table=items \
            --exclude-table=item_actions \
            --exclude-table=action_events \
            --exclude-table=item_search \
            "$PG_SQL_URL" > /tmp/sql.sql
          pg_dump --schema-only --no-owner --no-privileges \
            --exclude-table=items \
            --exclude-table=item_actions \
            --exclude-table=action_events \
            --exclude-table=item_search \
            "$PG_DRIZZLE_URL" > /tmp/drizzle.sql

          # Strip extension blocks: cube, earthdistance, pgcrypto are
          # loaded by the SQL bundle for the items_geo_earth_idx and
          # uuid generation on partitioned tables. drizzle-kit doesn't
          # load them. They're known infrastructure-only objects, not
          # subject to the auth/metrics surface we're comparing.
          for f in /tmp/sql.sql /tmp/drizzle.sql; do
            for ext in cube earthdistance pgcrypto; do
              sed -i -E "/^-- Name: ${ext}; Type: EXTENSION/d" "$f"
              sed -i -E "/^-- Name: EXTENSION ${ext}; Type: COMMENT/d" "$f"
              sed -i -E "/^CREATE EXTENSION IF NOT EXISTS ${ext} /d" "$f"
              sed -i -E "/^COMMENT ON EXTENSION ${ext} /d" "$f"
            done
          done

          # Filter out per-dump security nonces (PG18+ only; defensive
          # for PG16 we're on).
          sed -i -E 's/\\(restrict|unrestrict) [A-Za-z0-9]+/\\\1 <NONCE>/' /tmp/sql.sql /tmp/drizzle.sql

          # Normalize whitespace after the extension strip: removes the
          # orphan `--` section separators that bracketed the stripped
          # CREATE/COMMENT EXTENSION blocks, and collapses any runs of
          # consecutive blank lines. pg_dump's `--` separators bracket
          # every section header symmetrically on both sides, so removing
          # all standalone `--` lines is safe — content stays.
          for f in /tmp/sql.sql /tmp/drizzle.sql; do
            sed -i -E '/^--$/d' "$f"
            # cat -s collapses runs of blank lines to a single blank
            cat -s "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

          diff /tmp/sql.sql /tmp/drizzle.sql
