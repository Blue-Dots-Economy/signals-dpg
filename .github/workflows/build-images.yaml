name: build-images
# Release + manual image builds. The gated :develop publish moved into ci.yaml
# (`publish-images`, needs the CI checks) so a red build never ships :develop.
# `main` and `v*` tag builds are the release path (CI does not run on those
# refs); `workflow_dispatch` is the manual escape hatch.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            context: .
            dockerfile: apps/api/Dockerfile
          - name: ui
            context: .
            dockerfile: apps/ui/Dockerfile
          # signal-processor: Plan 3 territory, added once that ships.
          # match-score, notification-service: packages today, no Dockerfiles
          # in this repo. Add to the matrix once their Dockerfiles land.
    steps:
      - uses: actions/checkout@v4
      - name: Verify Dockerfile exists
        run: |
          if [ ! -f "${{ matrix.service.dockerfile }}" ]; then
            echo "Dockerfile not found at ${{ matrix.service.dockerfile }} — skipping ${{ matrix.service.name }}"
            exit 0
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/blue-dots-economy/signals-dpg/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
