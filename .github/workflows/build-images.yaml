name: Build and Push images (ui and api)
# Release + manual image builds. This is now the ONLY path that publishes api/ui
# images, and it publishes on a release tag or a manual run — never on a branch
# push (#756). The `:main` tag this used to produce was mutable: it moved under
# anyone who pulled it, and nothing consumed it (deployments pin a release tag or
# an immutable sha- tag in bluedots-automation's global-images.yaml). The gated
# :develop publish that used to live in ci.yaml (`publish-images`) is gone with
# it. `workflow_dispatch` is the manual escape hatch.
on:
  push:
    # Release tags. Two schemes, both additive to the dispatch path above:
    #   v*.*.*      semver releases   e.g. v1.2.0
    #   20*-s*-rc*  sprint release    e.g. 202608-s1-rc1
    #               <YYYYMM>-s<sprint>-rc<candidate>. A fix for an issue found
    #               in -rc1 ships as -rc2, so every candidate is its own image.
    #               Supersedes the dated GA-<date> scheme, no longer built here.
    # Note GitHub reads this workflow FROM THE TAGGED COMMIT, so a tag cut from a
    # branch that predates this change will not pick the new pattern up.
    tags: ['v*.*.*', '20*-s*-rc*']
  workflow_dispatch:
    inputs:
      skip_ci_check:
        description: 'Publish even if CI has not passed for this commit (emergency use only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write
  security-events: write   # Trivy image scan uploads SARIF to code-scanning

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: refuse to publish an image built from a commit CI has not passed
  # (#765). Until #756 split publishing out of ci.yaml, this was enforced by
  # `needs: [typecheck-api, typecheck-ui, test, schema-parity]` on the
  # publish-images job. That job is gone, and `needs:` cannot reach across
  # workflows, so the dependency is re-expressed as a lookup instead.
  #
  # It asks about ci.yaml RUNS rather than individual check runs, because this
  # repo's CI exposes one check per job (typecheck-api, test, sonar, …) and
  # there is no single check named "CI" to look for.
  #
  # Cheap by design: no re-run of the suite, just an API call. A release tag is
  # cut from develop or main, where CI has already run on that exact commit.
  verify-ci:
    name: Verify CI passed for this commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # read workflow runs for this SHA
    steps:
      - name: Require a successful ci.yaml run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SKIP: ${{ inputs.skip_ci_check }}
        run: |
          set -euo pipefail

          # `inputs` is empty on a tag push, so this is false unless someone
          # dispatched with the box ticked.
          if [ "${SKIP:-false}" = "true" ]; then
            echo "::warning title=CI gate bypassed::Publishing ${SHA} without checking CI, because skip_ci_check was set on this dispatch."
            exit 0
          fi

          runs=$(gh api --paginate \
            "repos/${REPO}/actions/workflows/ci.yaml/runs?head_sha=${SHA}" \
            --jq '.workflow_runs[] | "\(.status)/\(.conclusion // "pending")\t\(.event)\t\(.html_url)"')

          # FAIL CLOSED on no runs at all. This is the realistic accident: a tag
          # cut from a commit CI never saw (a feature branch, a local commit),
          # not a tag cut from a red one. A check for "not failed" would pass it.
          if [ -z "${runs}" ]; then
            echo "::error title=No CI run for this commit::ci.yaml has never run for ${SHA}, so there is nothing to verify. Cut the release tag from a commit on develop or main that CI has already tested."
            exit 1
          fi

          echo "ci.yaml runs found for ${SHA}:"
          echo "${runs}" | sed 's/^/  /'

          if echo "${runs}" | grep -q '^completed/success'; then
            echo "CI passed for ${SHA} — proceeding to build."
            exit 0
          fi

          echo "::error title=CI did not pass::No successful ci.yaml run exists for ${SHA}. Fix CI on that commit and re-tag, or re-run this workflow manually with skip_ci_check if this is a deliberate emergency publish."
          exit 1

  build:
    needs: verify-ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            context: .
            dockerfile: apps/api/Dockerfile
          - name: ui
            context: .
            dockerfile: apps/ui/Dockerfile
          # signal-processor: Plan 3 territory, added once that ships.
          # match-score, notification-service: packages today, no Dockerfiles
          # in this repo. Add to the matrix once their Dockerfiles land.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Dockerfile exists
        run: |
          if [ ! -f "${{ matrix.service.dockerfile }}" ]; then
            echo "Dockerfile not found at ${{ matrix.service.dockerfile }} — skipping ${{ matrix.service.name }}"
            exit 0
          fi
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Docker Hardened Images base layers are pulled from dhi.io, which does not
      # allow anonymous pulls even for the free Apache-2.0 catalog. Credentials
      # are a Docker Hub account; without this step the build fails at the first
      # FROM. Both matrix entries need it now — api and ui are both on DHI bases,
      # so the earlier `if: matrix.service.name == 'api'` guard is gone.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/blue-dots-economy/signals-dpg/${{ matrix.service.name }}
          # `type=ref,event=tag` emits the tag VERBATIM, so the image tag equals
          # the release tag (v1.2.0 -> v1.2.0, 202608-s1-rc1 -> 202608-s1-rc1).
          # It is required in addition to type=semver, which strips the leading
          # `v` (v1.2.0 -> 1.2.0) and cannot parse a 20*-s*-rc* tag at all — for those
          # it emits nothing and logs a warning, which is not a failure.
          # Comments stay OUT of the block scalar below: that value is passed to
          # the action verbatim, not parsed as YAML.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      # Image scanning (Sec-Audit A2 — Blue-Dots-Economy/signals-dpg#300).
      # Scans the OS + system packages baked into the shipped artifact, which the
      # source/lockfile scan in security.yml structurally cannot see (an outdated
      # base-image openssl appears in no package.json).
      #
      # Scanned by digest, not by tag: buildx pushes straight to the registry
      # without loading into the local docker image store, so `steps.build.outputs.imageid`
      # is not resolvable by Trivy here. The digest also pins the exact artifact
      # even if the tag is later moved. Registry auth comes from the docker/login-action
      # above, which Trivy picks up via ~/.docker/config.json.
      - name: Trivy image scan
        if: steps.build.outputs.digest != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/blue-dots-economy/signals-dpg/${{ matrix.service.name }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-image.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"   # Phase A: report-only, never fails the release build

      - name: Upload Trivy image SARIF
        if: always() && steps.build.outputs.digest != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-image.sarif
          # One category per image so api and ui alerts don't overwrite each other.
          category: trivy-image-${{ matrix.service.name }}
