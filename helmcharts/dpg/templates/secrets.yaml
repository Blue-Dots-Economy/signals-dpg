{{- /*
Render the three Secrets that subcharts consume by name:
  - dpg-postgres      (bitnami postgres existingSecret)
  - dpg-redis         (bitnami redis existingSecret)
  - dpg-api-secrets   (api chart existingSecret)
Passwords come from .Values.credentials.* — populated by install.sh.
If a password is empty the Secret is skipped so `helm template`/`lint`
stay clean before install.sh runs.
*/}}
{{- with .Values.credentials.postgresql }}
{{- if .password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .existingSecret }}
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
type: Opaque
stringData:
  {{ .adminPasswordKey }}: {{ .password | quote }}
  {{ .userPasswordKey }}: {{ .password | quote }}
{{- end }}
{{- end }}
---
{{- with .Values.credentials.redis }}
{{- if .password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .existingSecret }}
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
type: Opaque
stringData:
  {{ .passwordKey }}: {{ .password | quote }}
{{- end }}
{{- end }}
---
{{- if and .Values.credentials.api.authSecret .Values.credentials.postgresql.password .Values.credentials.redis.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentials.api.existingSecret }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  AUTH_SECRET: {{ .Values.credentials.api.authSecret | quote }}
  POSTGRES_USER: {{ .Values.credentials.postgresql.username | quote }}
  POSTGRES_DB: {{ .Values.credentials.postgresql.database | quote }}
  POSTGRES_PASSWORD: {{ .Values.credentials.postgresql.password | quote }}
  REDIS_PASSWORD: {{ .Values.credentials.redis.password | quote }}
{{- end }}
